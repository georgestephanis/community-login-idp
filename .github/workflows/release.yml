name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Assemble the plugin directory
        run: |
          mkdir -p dist
          rsync -a --exclude-from=.distignore ./ dist/community-login-idp/

      - name: Zip
        run: cd dist && zip -qr "../community-login-idp-${GITHUB_REF_NAME#v}.zip" community-login-idp

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "community-login-idp-${GITHUB_REF_NAME#v}.zip"
